<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>미국 증시 데일리 아카이브</title>
<style>
:root{--bg:#fff;--fg:#111827;--mute:#6b7280;--bd:#d1d5db;--pri:#2563eb;--soft:#f3f4f6;--red:#dc2626;--amb:#d97706;--grn:#16a34a}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--fg:#e5e7eb;--mute:#9ca3af;--bd:#2d3340;--soft:#181b22}}
*{box-sizing:border-box}body{margin:0;font-family:Pretendard,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;background:var(--bg);color:var(--fg);font-size:15px;line-height:1.55}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--bd);padding:10px 14px;z-index:5}
header h1{font-size:16px;margin:0 0 8px}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
select,input,button{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:6px 8px}
button{cursor:pointer}button:disabled{opacity:.4}
select{flex:1 1 200px;min-width:0}input[type=search]{flex:1 1 140px;min-width:0}
label.chk{font-size:13px;display:flex;gap:4px;align-items:center}
.wrap{display:flex;max-width:1200px;margin:0 auto}
aside{width:270px;border-right:1px solid var(--bd);height:calc(100vh - 90px);overflow:auto;position:sticky;top:90px}
aside .m{font-size:12px;color:var(--mute);padding:10px 12px 4px;font-weight:600}
aside a{display:block;padding:8px 12px;border-bottom:1px solid var(--bd);color:inherit;text-decoration:none;font-size:13px}
aside a.on{background:var(--soft);border-left:3px solid var(--pri)}
aside a .s{color:var(--mute);font-size:12px}
main{flex:1;min-width:0;padding:14px}
h2{font-size:17px;margin:22px 0 8px;border-bottom:1px solid var(--bd);padding-bottom:4px}
.head{font-size:15px;background:var(--soft);border:1px solid var(--bd);border-radius:8px;padding:10px 12px}
.meta{color:var(--mute);font-size:13px;margin-bottom:8px}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 9px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
th{background:var(--soft);font-size:12px;color:var(--mute);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.dn{color:var(--red)}.up{color:var(--grn)}
.lv{display:inline-block;min-width:26px;text-align:center;font-size:12px;font-weight:700;border-radius:4px;padding:1px 5px;border:1px solid}
.l상{color:var(--red);border-color:var(--red)}.l중{color:var(--amb);border-color:var(--amb)}.l하{color:var(--mute);border-color:var(--bd)}
ul{padding-left:20px;margin:8px 0}li{margin:3px 0}
.note{font-size:13px;color:var(--mute)}
.empty{padding:40px 10px;color:var(--mute)}
mark{background:#fde68a;color:#111}
@media (max-width:820px){aside{display:none}header{top:0}main{padding:10px}
 .cards tr{display:block;border-bottom:1px solid var(--bd);padding:6px 0}.cards thead{display:none}
 .cards td{display:block;border:0;padding:3px 10px}.cards td.n{text-align:left}
 .cards td[data-h]:before{content:attr(data-h)" · ";color:var(--mute);font-size:12px}}
</style></head><body>
<header><h1>미국 증시 데일리 아카이브</h1>
<div class="bar">
<button id="prev" title="이전 거래일">◀</button>
<select id="sel" aria-label="날짜 선택"></select>
<button id="next" title="다음 거래일">▶</button>
<input id="q" type="search" placeholder="키워드 (예: 엔비디아)">
<label class="chk"><input type="checkbox" id="hi">상만</label>
</div></header>
<div class="wrap"><aside id="side"></aside><main id="main"><div class="empty">불러오는 중…</div></main></div>
<script>
var list = [];
var cache = {};
var cur = -1;
var Q = "";
var HI = false;
var ORD = {"상": 0, "중": 1, "하": 2};

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c];
  });
}

function md(s) {
  var t = esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  if (Q) {
    var re = new RegExp("(" + Q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")(?![^<]*>)", "gi");
    t = t.replace(re, "<mark>$1</mark>");
  }
  return t;
}

function sign(s) {
  s = String(s || "");
  if (/^\s*-|\(-/.test(s)) {
    return "dn";
  }
  if (/^\s*\+|\(\+/.test(s)) {
    return "up";
  }
  return "";
}

function lv(l) {
  return '<span class="lv l' + esc(l) + '">' + esc(l) + "</span>";
}

function rows(arr) {
  arr = (arr || []).slice().sort(function (a, b) {
    return (ORD[a.level] ?? 9) - (ORD[b.level] ?? 9);
  });
  if (HI) {
    arr = arr.filter(function (x) {
      return x.level === "상";
    });
  }
  return arr;
}

function table(heads, data, cells) {
  if (!data.length) {
    return '<p class="note">해당 항목 없음</p>';
  }
  var h = "<div class='tw'><table class='cards'><thead><tr>";
  heads.forEach(function (x) {
    h += "<th>" + x + "</th>";
  });
  h += "</tr></thead><tbody>";
  data.forEach(function (r) {
    h += "<tr>" + cells(r) + "</tr>";
  });
  return h + "</tbody></table></div>";
}

function td(v, head, cls) {
  return "<td" + (cls ? ' class="' + cls + '"' : "") + (head ? ' data-h="' + head + '"' : "") + ">" + v + "</td>";
}

function bullets(a) {
  if (!a || !a.length) {
    return "";
  }
  return "<ul>" + a.map(function (x) {
    return "<li>" + md(x) + "</li>";
  }).join("") + "</ul>";
}

function render(d) {
  var h = "";
  h += '<div class="meta">미국 거래일 ' + esc(d.date) + " · 국내 영향일 " + esc(d.krDate) + "</div>";
  h += '<div class="head">' + md(d.headline) + "</div>";
  h += "<h2>① 지수</h2>";
  h += "<div class='tw'><table><thead><tr><th>지수·지표</th><th style='text-align:right'>종가</th><th style='text-align:right'>변동</th></tr></thead><tbody>";
  (d.indices || []).forEach(function (i) {
    h += "<tr><td>" + md(i.name) + (i.note ? "<div class='note'>" + md(i.note) + "</div>" : "") + "</td>";
    h += "<td class='n'>" + md(i.close) + "</td><td class='n " + sign(i.change) + "'>" + md(i.change) + "</td></tr>";
  });
  h += "</tbody></table></div>" + bullets(d.indexNotes);
  h += "<h2>② 실적·기업 뉴스</h2>";
  h += table(["중요도", "기업", "내용"], rows(d.earnings), function (r) {
    return td(lv(r.level)) + td("<strong>" + md(r.company) + "</strong>") + td(md(r.detail));
  });
  h += "<h2>③ 경제지표</h2>";
  h += table(["중요도", "지표", "실제", "예상", "이전", "평가"], rows(d.indicators), function (r) {
    return td(lv(r.level)) + td("<strong>" + md(r.name) + "</strong>") + td(md(r.actual), "실제", "n") + td(md(r.forecast), "예상", "n") + td(md(r.previous), "이전", "n") + td(md(r.assessment));
  });
  h += bullets(d.indicatorNotes);
  h += "<h2>④ 정치·외교 이슈</h2>";
  h += table(["중요도", "이슈", "시장 영향"], rows(d.politics), function (r) {
    return td(lv(r.level)) + td("<strong>" + md(r.issue) + "</strong>") + td(md(r.impact));
  });
  h += "<h2>⑤ 국내 증시 영향" + (d.koreaOutlook ? " — " + md(d.koreaOutlook) : "") + "</h2>";
  if (d.koreaNote) {
    h += "<p class='note'>" + md(d.koreaNote) + "</p>";
  }
  h += table(["중요도", "요인", "예상 영향", "관련 업종·종목"], rows(d.korea), function (r) {
    return td(lv(r.level)) + td("<strong>" + md(r.factor) + "</strong>") + td(md(r.impact)) + td(md(r.sectors), "관련");
  });
  if (d.koreaSummary) {
    h += "<p><strong>종합 판단:</strong> " + md(d.koreaSummary) + "</p>";
  }
  h += bullets(d.koreaWatch);
  if (d.sources && d.sources.length) {
    h += "<h2>출처</h2>" + bullets(d.sources);
  }
  h += "<p class='note'>⑤는 공개된 사실을 바탕으로 한 분석 의견이며 투자 권유가 아닙니다.</p>";
  return h;
}

function load(f) {
  if (cache[f]) {
    return Promise.resolve(cache[f]);
  }
  return fetch("reports/" + f, {cache: "no-cache"}).then(function (r) {
    return r.json();
  }).then(function (d) {
    cache[f] = d;
    return d;
  });
}

function show(i) {
  if (i < 0 || i >= list.length) {
    return;
  }
  cur = i;
  var it = list[i];
  document.getElementById("sel").value = String(i);
  document.getElementById("prev").disabled = i >= list.length - 1;
  document.getElementById("next").disabled = i <= 0;
  document.querySelectorAll("aside a").forEach(function (a) {
    a.classList.toggle("on", a.dataset.i === String(i));
  });
  if (location.hash !== "#" + it.date) {
    history.replaceState(null, "", "#" + it.date);
  }
  load(it.file).then(function (d) {
    document.getElementById("main").innerHTML = render(d);
    window.scrollTo(0, 0);
  }).catch(function () {
    document.getElementById("main").innerHTML = '<div class="empty">리포트를 불러오지 못했습니다.</div>';
  });
}

function buildNav() {
  var sel = document.getElementById("sel");
  var side = document.getElementById("side");
  var vis = [];
  var tasks = list.map(function (it, i) {
    if (!Q) {
      return Promise.resolve(true);
    }
    return load(it.file).then(function (d) {
      return JSON.stringify(d).toLowerCase().indexOf(Q.toLowerCase()) >= 0;
    });
  });
  Promise.all(tasks).then(function (ok) {
    var so = "";
    var sd = "";
    var month = "";
    list.forEach(function (it, i) {
      if (!ok[i]) {
        return;
      }
      vis.push(i);
      so += '<option value="' + i + '">' + esc(it.date) + "  S&P " + esc(it.sp500.replace(/^.*\(|\)$/g, "")) + "  " + esc(it.koreaOutlook) + "</option>";
      var m = it.date.slice(0, 7);
      if (m !== month) {
        month = m;
        sd += '<div class="m">' + m.replace("-", "년 ") + "월</div>";
      }
      sd += '<a href="#' + esc(it.date) + '" data-i="' + i + '">' + esc(it.date) + ' <span class="' + sign(it.sp500) + '">S&P ' + esc(it.sp500.replace(/^.*\(|\)$/g, "")) + "</span><br><span class='s'>" + esc(it.koreaOutlook) + " · 상 " + it.high + "건</span></a>";
    });
    sel.innerHTML = so || "<option>검색 결과 없음</option>";
    side.innerHTML = sd || '<div class="m">검색 결과 없음</div>';
    side.querySelectorAll("a").forEach(function (a) {
      a.onclick = function (e) {
        e.preventDefault();
        show(+a.dataset.i);
      };
    });
    if (vis.length) {
      show(vis.indexOf(cur) >= 0 ? cur : vis[0]);
    } else {
      document.getElementById("main").innerHTML = '<div class="empty">검색 결과가 없습니다.</div>';
    }
  });
}

fetch("reports/manifest.json", {cache: "no-cache"}).then(function (r) {
  return r.json();
}).then(function (m) {
  list = m.reports || [];
  if (!list.length) {
    document.getElementById("main").innerHTML = '<div class="empty">아직 리포트가 없습니다.</div>';
    return;
  }
  var h = location.hash.slice(1);
  var k = list.findIndex(function (x) {
    return x.date === h;
  });
  cur = k >= 0 ? k : 0;
  buildNav();
}).catch(function () {
  document.getElementById("main").innerHTML = '<div class="empty">목록(reports/manifest.json)을 불러오지 못했습니다. 웹서버(GitHub Pages 등)에서 열어 주세요.</div>';
});

document.getElementById("sel").onchange = function (e) {
  show(+e.target.value);
};
document.getElementById("prev").onclick = function () {
  show(cur + 1);
};
document.getElementById("next").onclick = function () {
  show(cur - 1);
};
var tm;
document.getElementById("q").oninput = function (e) {
  clearTimeout(tm);
  tm = setTimeout(function () {
    Q = e.target.value.trim();
    buildNav();
  }, 250);
};
document.getElementById("hi").onchange = function (e) {
  HI = e.target.checked;
  show(cur);
};
document.addEventListener("keydown", function (e) {
  if (e.target.tagName === "INPUT") {
    return;
  }
  if (e.key === "ArrowLeft") {
    show(cur + 1);
  }
  if (e.key === "ArrowRight") {
    show(cur - 1);
  }
});
</script></body></html>
